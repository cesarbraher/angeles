# Configuración Nginx con HTTPS obligatorio para habilitar instalación PWA
# Portal principal (FUNDACIÓN BRAHER): https://cebraher.org / https://braher.org
# Sistema ÁNGELES (PWA):               https://cebraher.org/angeles / https://braher.org/angeles

server {
    listen 80;
    listen [::]:80;
    server_name cebraher.org www.cebraher.org braher.org www.braher.org;

    # Redirección permanente a HTTPS (requisito obligatorio para Service Worker / PWA)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cebraher.org www.cebraher.org braher.org www.braher.org;

    # Certificados TLS (generados con Certbot / Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/cebraher.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cebraher.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Encabezados de seguridad clínica y PWA
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 15M;

    # Service Worker de /angeles/ nunca debe quedar atrapado en caché agresiva
    location = /angeles/sw.js {
        proxy_pass http://127.0.0.1:8000/angeles/sw.js;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/angeles/";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
